{% extends "base.html" %}
{% set title = "Sozlamalar → Kategoriya" %}
{% block content %}
  <div class="card">
    <b>Yangi kategoriya</b>
    <form method="post" action="/settings/categories/add" style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
      <input name="name" placeholder="Kategoriya nomi" required>
      <input name="sort_order" placeholder="Sort (100)" value="100">
      <button class="btn" type="submit">Qo‘shish</button>
    </form>
  </div>

  <div class="card">
    <b>Ro‘yxat</b>
    <table style="margin-top:10px">
      <tr><th>ID</th><th>Nomi</th><th>Sort</th><th>Holat</th><th></th></tr>
      {% for r in rows %}
      <tr>
        <td>{{ r.id }}</td>
        <td>{{ r.name }}</td>
        <td>{{ r.sort_order }}</td>
        <td>{{ "Active" if r.is_active==1 else "Off" }}</td>
        <td>
          <form method="post" action="/settings/categories/toggle/{{ r.id }}">
            <button class="btn" type="submit">Toggle</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
    <div style="margin-top:10px">
      <a class="badge" href="/settings/products">Mahsulot</a>
      <a class="badge" href="/settings/agents">Agent</a>
      <a class="badge" href="/settings/backup">Backup</a>
    </div>
  </div>
{% endblock %}
