<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ product.name }} — Shtrix-kod</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #edf0f5;
    color: #000;
    font-family: Arial, sans-serif;
  }
  .toolbar {
    padding: 20px;
    background: #fff;
    margin-bottom: 20px;
  }
  .toolbar button, .toolbar a {
    display: inline-block;
    padding: 10px 16px;
    margin-right: 10px;
  }
  .toolbar p { margin: 10px 0 0; }
  .label {
    width: {{ width }}mm;
    height: {{ height }}mm;
    padding: 1mm;
    margin: 10px auto;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .name {
    width: 100%;
    height: 8mm;
    overflow: hidden;
    text-align: center;
    font-size: 9pt;
    line-height: 4mm;
    overflow-wrap: anywhere;
  }
  svg {
    display: block;
    flex: none;
    width: 100%;
    height: 14mm;
  }
  .number {
    font-family: monospace;
    font-size: 11pt;
    line-height: 4mm;
    letter-spacing: .3mm;
  }
  @page {
    size: {{ width }}mm {{ height }}mm;
    margin: 0;
  }
  @media print {
    html, body {
      width: {{ width }}mm;
      margin: 0;
      padding: 0;
      background: #fff;
    }
    .toolbar { display: none; }
    .label {
      margin: 0;
      break-inside: avoid;
      break-after: page;
      page-break-after: always;
    }
    .label:last-child {
      break-after: auto;
      page-break-after: auto;
    }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button type="button" onclick="window.print()">Chop etish</button>
  <a href="{{ url_for('settings_product_barcodes',
                     product_id=product.id) }}">Mahsulotga qaytish</a>
  <p>{{ copies }} ta yorliq · {{ width }} × {{ height }} mm</p>
  <p>Printerda shu qog‘oz o‘lchamini tanlang.
     Masshtab: 100%. Sahifa sarlavhasi va pastki yozuvlarni o‘chiring.</p>
</div>
{% for copy in range(copies) %}
<div class="label">
  <div class="name">{{ product.name }}</div>
  <svg xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 113 50" preserveAspectRatio="none"
       role="img" aria-label="{{ barcode }}">
    <rect width="113" height="50" fill="white"/>
    {% for bit in bits %}
    {% if bit == '1' %}
    <rect x="{{ loop.index0 + 11 }}" y="0" width="1"
          height="50" fill="black"/>
    {% endif %}
    {% endfor %}
  </svg>
  <div class="number">{{ barcode }}</div>
</div>
{% endfor %}
</body>
</html>
