{% extends "base.html" %}
{% block content %}
<div style="max-width:720px; margin:18px auto; padding:16px;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;">
    <h2 style="margin:0; font-size:20px;">Kassa: tahrirlash</h2>
    <a href="{{ url_for('kassa') }}" style="text-decoration:none; padding:10px 12px; border-radius:10px; background:#111827; border:1px solid rgba(255,255,255,.12); color:#fff;">
      ← Orqaga
    </a>
  </div>

  <div style="padding:14px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.10);">
    {% if is_auto_sale %}
      <div style="padding:10px 12px; border-radius:12px; background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.25); margin-bottom:12px;">
        <b>Auto sale</b> yozuvi: direction va summa o‘zgarmaydi. Faqat izohni tahrirlash mumkin.
      </div>
    {% endif %}

    <form method="POST" style="display:grid; gap:10px;">
      <div style="display:grid; gap:6px;">
        <label style="opacity:.9;">Sana</label>
        <input name="move_date" value="{{ r.move_date }}" {% if is_auto_sale %}disabled{% endif %}
               style="padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:#0b1220; color:#fff;" />
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <div style="flex:1; min-width:180px; display:grid; gap:6px;">
          <label style="opacity:.9;">Direction</label>
          <select name="direction" {% if is_auto_sale %}disabled{% endif %}
                  style="padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:#0b1220; color:#fff;">
            <option value="IN" {% if r.direction=='IN' %}selected{% endif %}>IN</option>
            <option value="OUT" {% if r.direction=='OUT' %}selected{% endif %}>OUT</option>
          </select>
        </div>

        <div style="flex:1; min-width:220px; display:grid; gap:6px;">
          <label style="opacity:.9;">Summa (UZS)</label>
          <input name="amount_uzs" inputmode="numeric" value="{{ '{:,.0f}'.format(r.amount_uzs or 0).replace(',', ' ') }}"
                 {% if is_auto_sale %}disabled{% endif %}
                 style="padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:#0b1220; color:#fff;" />
        </div>
      </div>

      <div style="display:grid; gap:6px;">
        <label style="opacity:.9;">Izoh</label>
        <input name="note" value="{{ r.note or '' }}"
               style="padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:#0b1220; color:#fff;" />
      </div>

      <button type="submit"
              style="padding:12px; border-radius:12px; border:none; cursor:pointer; background:#22c55e; color:#071018; font-weight:700;">
        Saqlash ✅
      </button>
    </form>
  </div>
</div>
{% endblock %}
