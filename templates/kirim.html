{% extends "base.html" %}
{% block content %}
<div class="page">
  <div class="page-title">Kirim</div>

  <div class="card">
    <form method="post" class="kirim-form">
      <div class="kirim-grid">
        <div class="kirim-field span-2">
          <label>Mahsulot</label>
          <select name="product_id" required>
            <option value="">Tanlang...</option>
            {% for p in products %}
              <option value="{{ p.id }}">{{ p.category_name }} — {{ p.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="kirim-field">
          <label>Sana</label>
          <input type="date" name="move_date">
        </div>

        <div class="kirim-field">
          <label>Miqdor</label>
          <input name="qty" inputmode="decimal" placeholder="masalan: 10" required>
        </div>

        <div class="kirim-field">
          <label>Tan narx (so'm, ixtiyoriy)</label>
          <input name="unit_cost_uzs" inputmode="decimal" placeholder="0">
        </div>

        <div class="kirim-field">
          <label>Izoh</label>
          <input name="note" placeholder="ixtiyoriy">
        </div>
      </div>

      <div class="kirim-actions">
        <button class="btn" type="submit">Saqlash</button>
      </div>
    </form>
  </div>

  <div style="height:14px"></div>

  <div class="card">
    <div class="card-title">Oxirgi kirimlar</div>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Sana</th>
            <th>Mahsulot</th>
            <th style="text-align:right;">Miqdor</th>
            <th style="text-align:right;">Tan narx</th>
          </tr>
        </thead>
        <tbody>
          {% for m in moves %}
          <tr>
            <td>{{ m.move_date }}</td>
            <td>{{ m.product_name }}</td>
            <td style="text-align:right;">{{ (m.qty or 0) | round(2) }}</td>
            <td style="text-align:right;">{{ (m.unit_cost_uzs or 0) | round(0) }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
